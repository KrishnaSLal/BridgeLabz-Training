# =========================================================
# APPLICATION
# =========================================================

spring.application.name=api-gateway

server.port=8080


# =========================================================
# EUREKA
# =========================================================

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true


# =========================================================
# AUTH SERVICE
# =========================================================

spring.cloud.gateway.routes[0].id=auth-service

spring.cloud.gateway.routes[0].uri=lb://auth-service

spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[0].filters[1]=CircuitBreaker=authCircuitBreaker,fallbackUri=forward:/fallback/auth


# =========================================================
# USER SERVICE
# =========================================================

spring.cloud.gateway.routes[1].id=user-service

spring.cloud.gateway.routes[1].uri=lb://user-service

spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].filters[1]=CircuitBreaker=userCircuitBreaker,fallbackUri=forward:/fallback/users


# =========================================================
# NOTES SERVICE
# =========================================================

spring.cloud.gateway.routes[2].id=notes-service

spring.cloud.gateway.routes[2].uri=lb://notes-service

spring.cloud.gateway.routes[2].predicates[0]=Path=/api/notes/**

spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].filters[1]=CircuitBreaker=notesCircuitBreaker,fallbackUri=forward:/fallback/notes


# =========================================================
# LABEL SERVICE
# =========================================================

