spring.cloud.gateway.routes[4].uri=lb://reminder-service

spring.cloud.gateway.routes[4].predicates[0]=Path=/api/reminders/**

spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[4].filters[1]=CircuitBreaker=reminderCircuitBreaker,fallbackUri=forward:/fallback/reminders


# =========================================================
