# =========================================================
# DISCOVERY LOCATOR
# =========================================================

spring.cloud.gateway.discovery.locator.enabled=false


# =========================================================
# RESILIENCE4J
# =========================================================

resilience4j.circuitbreaker.instances.authCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.authCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.authCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.authCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.authCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.authCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3


resilience4j.circuitbreaker.instances.userCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.userCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3


resilience4j.circuitbreaker.instances.notesCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.notesCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.notesCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.notesCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notesCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.notesCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3


resilience4j.circuitbreaker.instances.labelCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.labelCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.labelCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.labelCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.labelCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.labelCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3


resilience4j.circuitbreaker.instances.reminderCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.reminderCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.reminderCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.reminderCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.reminderCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.reminderCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3


resilience4j.circuitbreaker.instances.notificationCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3


resilience4j.circuitbreaker.instances.exportCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.exportCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.exportCircuitBreaker.minimumNumberOfCalls=5
