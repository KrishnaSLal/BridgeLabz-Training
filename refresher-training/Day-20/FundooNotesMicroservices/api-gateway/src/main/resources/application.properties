spring.cloud.gateway.routes[3].uri=lb://notes-service

spring.cloud.gateway.routes[3].predicates[0]=Path=/api/labels/**

spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].filters[1]=CircuitBreaker=labelCircuitBreaker,fallbackUri=forward:/fallback/notes


# =========================================================
# REMINDER SERVICE
# =========================================================

