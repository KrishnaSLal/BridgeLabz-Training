spring.application.name=notification-service

server.port=8087


# =====================================================
# MYSQL
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notification_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# EUREKA
# =====================================================

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true


# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET}


# =====================================================
# ACTIVEMQ
# =====================================================

spring.artemis.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}

spring.artemis.user=${ACTIVEMQ_USER:admin}
spring.artemis.password=${ACTIVEMQ_PASSWORD:admin}


# =====================================================
# JMS
# =====================================================

spring.jms.listener.auto-startup=true


# =====================================================
# SMTP
# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =====================================================
# LOGGING
# =====================================================

logging.level.root=INFO
logging.level.com.fundoo.notification=DEBUG