# =========================================================
# SERVER
# =========================================================

server.port=8082


# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms


# =========================================================
# ACTIVEMQ
# =========================================================

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}

spring.jms.pub-sub-domain=false


# =========================================================
# RABBITMQ
# =========================================================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.com.fundoo.notes=DEBUG
logging.level.org.springframework.data.redis=INFO