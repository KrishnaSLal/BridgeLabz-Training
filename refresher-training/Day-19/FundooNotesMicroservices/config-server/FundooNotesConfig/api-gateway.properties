# =========================================================
# SERVER
# =========================================================

server.port=8080


# =========================================================
# EUREKA
# =========================================================

eureka.instance.hostname=localhost


# =========================================================
# AUTH SERVICE
# =========================================================

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1


# =========================================================
# USER SERVICE
# =========================================================

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1


# =========================================================
# NOTES / LABEL SERVICE
# =========================================================

spring.cloud.gateway.routes[2].id=label-service
spring.cloud.gateway.routes[2].uri=lb://notes-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/labels/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1


# =========================================================
# REMINDER SERVICE
# =========================================================

spring.cloud.gateway.routes[3].id=reminder-service
spring.cloud.gateway.routes[3].uri=lb://reminder-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/reminders/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1


# =========================================================
# EXPORT SERVICE
# =========================================================

spring.cloud.gateway.routes[4].id=export-service
spring.cloud.gateway.routes[4].uri=lb://export-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/export/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1


# =========================================================
# DISCOVERY LOCATOR
# =========================================================

spring.cloud.gateway.discovery.locator.enabled=false


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO