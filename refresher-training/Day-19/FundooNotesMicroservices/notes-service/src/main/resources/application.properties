# =========================================================
# APPLICATION
# =========================================================

spring.application.name=notes-service


# =========================================================
# SERVER
# =========================================================

server.port=8082


# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes_db

spring.datasource.username=root

spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# EUREKA
# =========================================================

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.hostname=localhost

eureka.instance.prefer-ip-address=true


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

jwt.expiration=3600000


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=localhost

spring.data.redis.port=6379

spring.data.redis.timeout=2000ms


# =========================================================
# ACTIVEMQ / JMS
# =========================================================

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}

spring.activemq.user=${ACTIVEMQ_USER:admin}

spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}

spring.jms.pub-sub-domain=false


# =========================================================
# RABBITMQ
# =========================================================

spring.rabbitmq.host=localhost

spring.rabbitmq.port=5672

spring.rabbitmq.username=guest

spring.rabbitmq.password=guest


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO

logging.level.com.fundoo.notes=DEBUG

logging.level.org.springframework.data.redis=INFO