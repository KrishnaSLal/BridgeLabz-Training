<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Contacts</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .add-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        .edit-button {
            padding: 6px 10px;
            background-color: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete-button {
            padding: 6px 10px;
            background-color: #f44336;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<h1>Contacts</h1>

<a class="add-button"
   th:href="@{/contacts/add}">
    Add Contact
</a>

<table>

    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Alternate Phone</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="contact : ${contacts}">

        <td th:text="${contact.id}"></td>

        <td th:text="${contact.name}"></td>

        <td th:text="${contact.phone}"></td>

        <td th:text="${contact.alternatePhone}"></td>

        <td th:text="${contact.email}"></td>

        <td>

            <a class="edit-button"
               th:href="@{/contacts/edit/{id}(id=${contact.id})}">
                Edit
            </a>

            <a class="delete-button"
               th:href="@{/contacts/delete/{id}(id=${contact.id})}"
               onclick="return confirm('Are you sure you want to delete this contact?');">
                Delete
            </a>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
