spring.application.name=FundooNotesApp

# =========================================================
# SERVER
# =========================================================

server.port=8080


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/fundoonotesdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000


# =========================================================
# SMTP / EMAIL
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =========================================================
# RABBITMQ
# =========================================================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


# ===============================
# ACTIVEMQ / JMS
# ===============================

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}

# JMS
spring.jms.pub-sub-domain=false


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Redis connection timeout
spring.data.redis.timeout=2000ms

# =========================================================
# REMINDER SCHEDULER
# =========================================================

reminder.scheduler.delay-ms=30000


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.com.fundoonotes=DEBUG

# Redis logging ( only fr testing)
logging.level.org.springframework.data.redis=INFO