<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>All Students</title>

</head>

<body>

    <h1>All Students</h1>

    <a href="/register">
        Add New Student
    </a>

    <br><br>

    <table border="1">

        <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Password</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody>

            <tr th:each="student : ${students}">

                <td th:text="${student.id}">
                </td>

                <td th:text="${student.name}">
                </td>

                <td th:text="${student.email}">
                </td>

                <td th:text="${student.password}">
                </td>

                <td>

                    <a th:href="@{/student/edit(id=${student.id})}">
                        Edit
                    </a>

                    |

                    <a th:href="@{/student/delete(id=${student.id})}"
                       onclick="return confirm('Are you sure you want to delete this student?')">

                        Delete

                    </a>

                </td>

            </tr>

        </tbody>

    </table>

    <br>

    <a href="/">
        Back to Home
    </a>

</body>

</html>
