<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Student Login</title>

</head>

<body>

    <h1>Student Login</h1>


    <p th:if="${error}"
       th:text="${error}">
    </p>


    <form action="/login" method="post">


        <label>Email:</label>

        <input type="email"
               name="email"
               required>


        <br><br>


        <label>Password:</label>

        <input type="password"
               name="password"
               required>


        <br><br>


        <button type="submit">
            Login
        </button>


    </form>


    <br>


    <a href="/">
        Back to Home
    </a>

</body>

</html>
