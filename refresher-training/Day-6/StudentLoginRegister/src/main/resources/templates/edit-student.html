<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Edit Student</title>

</head>

<body>

    <h1>Edit Student</h1>


    <form action="/student/update"
          method="post"
          th:object="${student}">


        <!-- Hidden ID -->

        <input type="hidden"
               th:field="*{id}">


        <label>Name:</label>

        <input type="text"
               th:field="*{name}"
               required>


        <br><br>


        <label>Email:</label>

        <input type="email"
               th:field="*{email}"
               required>


        <br><br>


        <label>Password:</label>

        <input type="password"
               th:field="*{password}"
               required>


        <br><br>


        <button type="submit">
            Update Student
        </button>


    </form>


    <br>


    <a href="/students">
        Back to Students
    </a>

</body>

</html>
